[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisprmatch"
version = "0.1.0"
description = "Installable CRISPRMatch GUI and dual-barcode NGS utilities"
readme = "README.md"
requires-python = ">=3.8,<3.13"
authors = [
  {name = "qyou", email = "youqi@yzu.edu.cn"},
]
maintainers = [
  {name = "xiettiansong"},
]
keywords = ["CRISPR", "NGS", "FASTQ", "demultiplexing", "genome editing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "matplotlib>=3.7,<3.10",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyfaidx>=0.8,<1",
  "PyQt5>=5.15,<5.16",
  "pysam>=0.22,<0.25",
  "scipy>=1.10,<2",
]

[project.urls]
Original-Repository = "https://github.com/zhangtaolab/CRISPRMatchGUI"

[project.scripts]
crisprmatch = "crisprmatch.cli:main"
crisprmatch-split = "crisprmatch.cli:split"
crisprmatch-merge = "crisprmatch.cli:merge"

[project.optional-dependencies]
test = ["pytest>=7.4,<9", "pytest-cov>=5,<7"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crisprmatch.CMlib" = ["*.ui"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration'"
testpaths = ["tests"]
markers = [
  "integration: checks external executables supplied by the conda environment",
]

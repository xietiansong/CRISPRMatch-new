name: crisprmatch
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - bwa=0.7.17
  - samtools=1.19
  - flash=1.2.11
  - pyqt=5.15
  - pandas=2.2
  - numpy=1.26
  - scipy=1.12
  - matplotlib=3.8
  - pysam=0.22
  - pyfaidx=0.8
  - pytest=8
  - pytest-cov=5
  - pip:
      - -e .
